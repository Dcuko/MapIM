<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mapa do campus de Nova Iguaçu (IM) da UFRRJ: pesquise salas e departamentos.">
    <meta name="theme-color" content="#1f3d84">
    <title>MapIM</title>
    <link rel="icon" type="image/x-icon" href="img/logosemnome.ico">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body>
    <main class="hero">
        <img class="hero-logo" src="img/logosemnome.png" alt="UFRRJ" width="88" height="88">
        <h1>Mapa <span>IM</span></h1>
        <p class="lead">Encontre salas, departamentos e coordenações do campus de Nova Iguaçu.</p>

        <form class="search" id="form" role="search" autocomplete="off" novalidate>
            <div class="search-field">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input class="search-input" id="search" type="text" name="search" role="combobox"
                    aria-label="Buscar sala ou departamento" aria-autocomplete="list" aria-expanded="false"
                    aria-controls="results" placeholder="Sala de aula, departamento..." autocomplete="off">
                <button class="btn btn-primary" type="submit">Buscar</button>
            </div>
            <ul class="results" id="results" role="listbox" aria-label="Resultados" hidden></ul>
            <p class="field-error" id="search-error" role="alert" hidden></p>
        </form>

        <div class="actions">
            <a class="btn btn-secondary" href="mapa.html">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
                Explorar o mapa
            </a>
        </div>

        <nav class="shortcuts" aria-label="Atalhos por andar">
            <span>Ir direto para:</span>
            <a class="chip" href="mapa.html?andar=1">1º andar</a>
            <a class="chip" href="mapa.html?andar=2">2º andar</a>
            <a class="chip" href="mapa.html?andar=3">3º andar</a>
            <a class="chip" href="mapa.html?andar=4">Pós</a>
        </nav>
    </main>

    <footer class="footer">Desenvolvido com &#128151; por PN</footer>

    <script type="module" src="js/home.js"></script>
</body>

</html>
