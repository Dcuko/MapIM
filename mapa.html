<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1f3d84">
    <title>Mapa — MapIM</title>
    <link rel="icon" type="image/x-icon" href="img/logosemnome.ico">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/map.css">
</head>

<body class="map-page">
    <header class="topbar">
        <a class="icon-btn" href="index.html" aria-label="Voltar para a busca">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <nav class="floor-tabs" aria-label="Andares">
            <button type="button" class="floor-tab" data-andar="1">1º</button>
            <button type="button" class="floor-tab" data-andar="2">2º</button>
            <button type="button" class="floor-tab" data-andar="3">3º</button>
            <button type="button" class="floor-tab" data-andar="4">Pós</button>
        </nav>
        <a class="brand" href="index.html" aria-label="MapIM">
            <img src="img/logosemnome.png" alt="" width="40" height="40">
        </a>
    </header>

    <main class="viewport" id="viewport">
        <div class="stage" id="stage"></div>
        <p class="status" id="status" role="status">Carregando mapa…</p>
    </main>

    <div class="zoom-controls" role="group" aria-label="Zoom">
        <button type="button" class="icon-btn" id="zoom-in" aria-label="Aproximar">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" class="icon-btn" id="zoom-out" aria-label="Afastar">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <button type="button" class="icon-btn" id="zoom-reset" aria-label="Ajustar à tela">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
    </div>

    <section class="sheet" id="sheet" aria-live="polite" hidden>
        <button type="button" class="sheet-close" id="sheet-close" aria-label="Fechar">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <p class="sheet-meta" id="sheet-meta"></p>
        <h1 class="sheet-title" id="sheet-title"></h1>
        <p class="sheet-text" id="sheet-text"></p>
    </section>

    <script type="module" src="js/map.js"></script>
</body>

</html>
